name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "Key file size: $(wc -c < /tmp/deploy_key) bytes"
          echo "First line: $(head -1 /tmp/deploy_key)"
          ssh-keygen -l -f /tmp/deploy_key 2>&1 || echo "Key invalid"

      - name: Deploy via SSH
        run: |
          set -e
          ssh -o StrictHostKeyChecking=accept-new \
            -i /tmp/deploy_key \
            -v \
            moha@${{ secrets.SSH_HOST }} '
            set -e
            sudo -n -u mohacardiffuk -H bash -c "cd /home/mohacardiffuk/Kaffza-Web && git pull origin main"
            sudo -n docker compose \
              --env-file /home/mohacardiffuk/Kaffza-Web/production/.env \
              -f /home/mohacardiffuk/Kaffza-Web/production/docker-compose.yml \
              up -d --build web api
          '
