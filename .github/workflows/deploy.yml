name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy via SSH
        run: |
          set -e
          ssh -o StrictHostKeyChecking=accept-new moha@${{ secrets.SSH_HOST }} '
            set -e
            sudo -n -u mohacardiffuk -H bash -c "cd /home/mohacardiffuk/Kaffza-Web && git pull origin main"
            sudo -n docker compose \
              --env-file /home/mohacardiffuk/Kaffza-Web/production/.env \
              -f /home/mohacardiffuk/Kaffza-Web/production/docker-compose.yml \
              up -d --build web api
          '
