name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key and connect
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: moha
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo -n -u mohacardiffuk -H bash -c "cd /home/mohacardiffuk/Kaffza-Web && git pull origin main"
            sudo -n docker compose \
              --env-file /home/mohacardiffuk/Kaffza-Web/production/.env \
              -f /home/mohacardiffuk/Kaffza-Web/production/docker-compose.yml \
              up -d --build web api
